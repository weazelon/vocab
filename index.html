<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kana + Vocab Trainer v3.5</title>
<style>
:root{
  --bg:#151a24; --panel:#1e2533; --panel2:#262f40; --line:#34405a;
  --ink:#ece7dc; --ink2:#a9b0c2; --gold:#e2c27a; --ok:#7fc9a6; --bad:#e08a7a; --blue:#7fb2e0;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
.ja{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:600}
header h1 span{color:var(--gold);font-weight:400}
.stat{color:var(--ink2);font-size:14px}
.stat b{color:var(--ink)}
nav{display:flex;gap:6px;padding:10px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:transparent;border:1px solid var(--line);color:var(--ink2);padding:7px 13px;border-radius:999px;cursor:pointer;font-size:14px}
nav button.on{background:var(--panel2);color:var(--ink);border-color:var(--gold)}
main{max-width:860px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
h2{margin:0 0 8px;font-size:17px}
p{margin:6px 0;color:var(--ink2)}
.big{font-size:96px;line-height:1.1;text-align:center;margin:10px 0 18px;color:var(--gold)}
.word{font-size:64px;line-height:1.15;text-align:center;margin:8px 0 14px;color:var(--gold)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:stretch}
@media(min-width:560px){.choices{grid-template-columns:repeat(4,1fr)}}
button.opt{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:14px 10px;border-radius:12px;font-size:20px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button.opt .keyhint{position:absolute;right:6px;bottom:4px;margin:0}
button.opt{position:relative}
.choices.wide{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.choices.wide{grid-template-columns:repeat(2,1fr)}}
button.opt:focus-visible{outline:2px solid var(--gold)}
button.opt.sel{border-color:var(--gold);color:var(--gold);background:#2f3448}
button.opt.ok{border-color:var(--ok);color:var(--ok)}
button.opt.bad{border-color:var(--bad);color:var(--bad)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px}
.btn.gold{background:var(--gold);color:#1a1608;border-color:var(--gold);font-weight:600}
.btn.small{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.feedback{min-height:28px;margin-top:10px;font-size:16px}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:10px;font-size:22px;width:100%;text-align:center}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-size:13px;cursor:pointer;margin:3px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.meaning{text-align:center;font-size:20px;margin:6px 0}
.romaji{text-align:center;color:var(--ink2);font-size:16px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:64px;padding:10px;border:1px dashed var(--line);border-radius:12px;margin:10px 0}
.tile{background:var(--panel2);border:1px solid var(--line);color:var(--gold);font-size:28px;padding:8px 14px;border-radius:10px;cursor:pointer;line-height:1.2}
.tile.used{opacity:.25;pointer-events:none}
.tile.part{color:var(--blue)}
#ans .tile{cursor:pointer}
.itemstat{font-size:12px;color:var(--ink2);text-align:center;margin-top:4px}
.keyhint{font-size:11px;color:var(--ink2);margin-left:6px}
button:disabled{opacity:.4;cursor:default}
.pad{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pad button{background:var(--panel2);border:1px solid var(--line);color:var(--gold);font-size:24px;padding:6px 12px;border-radius:8px;cursor:pointer;min-width:44px}
.built{font-size:34px;min-height:56px;text-align:center;color:var(--gold);padding:6px;border:1px dashed var(--line);border-radius:10px;margin:8px 0}
.reg{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);margin-left:6px;vertical-align:middle}
.note{background:var(--panel2);border-left:3px solid var(--blue);padding:8px 12px;border-radius:6px;font-size:14px;margin-top:8px;color:var(--ink)}
.note b{color:var(--blue)}
.gloss{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
.g{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center;min-width:54px}
.g .gj{font-size:20px;color:var(--gold)} .g .ge{font-size:11px;color:var(--ink2);max-width:110px}
.ftable{width:100%;border-collapse:collapse}
.ftable td{padding:6px 8px;border-bottom:1px solid var(--line)}
.ftable td.fj{font-size:22px;color:var(--gold);white-space:nowrap}
.ftable td.fl{color:var(--ink2);font-size:13px}
.formq{text-align:center;margin:8px 0}
.formq .v{font-size:44px;color:var(--gold)}
.formq .t{font-size:20px;color:var(--blue);margin-top:6px}
.score{font-size:40px;text-align:center;color:var(--gold);margin:8px 0}
.miss{border-left:3px solid var(--bad);padding:6px 10px;margin:6px 0;background:var(--panel2);border-radius:6px}
.hist td{padding:4px 8px;border-bottom:1px solid var(--line);font-size:14px}
.lesson{background:var(--panel2);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin:10px 0}
.lesson h3{margin:0 0 6px;font-size:16px;color:var(--gold)}
.lesson .ex{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.lesson .ex .ja{color:var(--gold);font-size:18px}
details.hintbox{margin:6px auto;max-width:520px}
details.hintbox summary{cursor:pointer;color:var(--ink2);font-size:13px;list-style:none;text-align:center;padding:4px 10px;border:1px dashed var(--line);border-radius:999px;display:inline-block}
details.hintbox summary::-webkit-details-marker{display:none}
details.hintbox[open] summary{border-color:var(--gold);color:var(--gold)}
details.hintbox .inner{margin-top:6px}
.qbox{font-size:34px;text-align:center;color:var(--gold);margin:10px 0 4px;line-height:1.3}
.ans{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.ans .a{font-size:24px;color:var(--gold)} .ans .ar{color:var(--ink2);font-size:14px} .ans .ae{font-size:15px}
select,input[type=password],input.plain{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:14px;max-width:100%}
input[type=range]{width:160px;vertical-align:middle}
.lab{display:inline-block;min-width:110px;color:var(--ink2);font-size:14px}
textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px;font-size:18px;width:100%;min-height:70px;font-family:inherit}
canvas{background:#0f1319;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block;margin:0 auto}
.canvasWrap{position:relative;width:280px;height:280px;margin:10px auto}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(226,194,122,.18);pointer-events:none;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.kcell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 2px}
.kcell .k{font-size:26px;color:var(--gold)} .kcell .r{font-size:12px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.j{font-size:22px;color:var(--gold);white-space:nowrap}
td.r{color:var(--ink2)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold)}
.hint{font-size:13px;color:var(--ink2)}
.warn{color:var(--bad)}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .n{color:var(--gold);font-size:22px;min-width:28px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Kana + Vocab Trainer <span>v3.5</span></h1>
  <div class="stat"><button class="btn small" id="sndBtn">Sound: on</button> Today: <b id="sOk">0</b> right / <b id="sBad">0</b> wrong | streak <b id="sStreak">0</b></div>
</header>
<nav id="nav">
  <button data-m="home" class="on">Home</button>
  <button data-m="kana">Read kana</button>
  <button data-m="kanatype">Type kana</button>
  <button data-m="vocab">Words</button>
  <button data-m="sent">Sentences</button>
  <button data-m="talk">Talk</button>
  <button data-m="chat">Chat</button>
  <button data-m="forms">Forms</button>
  <button data-m="test">Test</button>
  <button data-m="write">Write</button>

</nav>
<main id="main"></main>

<script>
/* ---------- DATA ---------- */
const HROWS=[
 ['a','あ','い','う','え','お'],['ka','か','き','く','け','こ'],['sa','さ','し','す','せ','そ'],
 ['ta','た','ち','つ','て','と'],['na','な','に','ぬ','ね','の'],['ha','は','ひ','ふ','へ','ほ'],
 ['ma','ま','み','む','め','も'],['ya','や','ゆ','よ'],['ra','ら','り','る','れ','ろ'],['wa','わ','を','ん']
];
const ROWROM={a:['a','i','u','e','o'],ka:['ka','ki','ku','ke','ko'],sa:['sa','shi','su','se','so'],ta:['ta','chi','tsu','te','to'],
 na:['na','ni','nu','ne','no'],ha:['ha','hi','fu','he','ho'],ma:['ma','mi','mu','me','mo'],ya:['ya','yu','yo'],ra:['ra','ri','ru','re','ro'],wa:['wa','wo','n']};
const DAKU=[['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go'],['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo'],
 ['だ','da'],['ぢ','ji'],['づ','zu'],['で','de'],['ど','do'],['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo'],
 ['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po']];
const YOON=[['きゃ','kya'],['きゅ','kyu'],['きょ','kyo'],['しゃ','sha'],['しゅ','shu'],['しょ','sho'],['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho'],
 ['にゃ','nya'],['にゅ','nyu'],['にょ','nyo'],['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo'],['みゃ','mya'],['みゅ','myu'],['みょ','myo'],
 ['りゃ','rya'],['りゅ','ryu'],['りょ','ryo'],['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo'],['じゃ','ja'],['じゅ','ju'],['じょ','jo'],
 ['びゃ','bya'],['びゅ','byu'],['びょ','byo'],['ぴゃ','pya'],['ぴゅ','pyu'],['ぴょ','pyo']];
const toKata=s=>[...s].map(c=>{const o=c.codePointAt(0);return (o>=0x3041&&o<=0x3096)?String.fromCodePoint(o+0x60):c}).join('');
const ALT={shi:['si'],chi:['ti'],tsu:['tu'],fu:['hu'],ji:['zi','di'],zu:['du'],sha:['sya'],shu:['syu'],sho:['syo'],cha:['tya'],chu:['tyu'],cho:['tyo'],ja:['zya','jya'],ju:['zyu','jyu'],jo:['zyo','jyo'],wo:['o']};
function buildKana(){
  const list=[];
  HROWS.forEach(r=>{const key=r[0];r.slice(1).forEach((h,i)=>{const rom=ROWROM[key][i];list.push({h,k:toKata(h),r:rom,row:key})})});
  DAKU.forEach(([h,r])=>list.push({h,k:toKata(h),r,row:'daku'}));
  YOON.forEach(([h,r])=>list.push({h,k:toKata(h),r,row:'yoon'}));
  return list;
}
const KANA=buildKana();
const ROWLABEL={a:'a row',ka:'ka row',sa:'sa row',ta:'ta row',na:'na row',ha:'ha row',ma:'ma row',ya:'ya row',ra:'ra row',wa:'wa / wo / n',daku:'dakuten (ga, za, da, ba, pa)',yoon:'combos (kya, sha, cho)'};

// vocab: [kana, romaji, english, category, warn]
const VOCAB=[
 ['ラーメン','raamen','ramen','food'],['ぎゅうにく','gyuuniku','beef','food'],['とりにく','toriniku','chicken','food'],['ぶたにく','butaniku','pork','food'],
 ['やきにく','yakiniku','grilled meat','food'],['とんかつ','tonkatsu','pork cutlet','food'],['からあげ','karaage','fried chicken','food'],['ぎょうざ','gyouza','gyoza dumplings','food'],
 ['カレー','karee','curry','food'],['ハンバーグ','hanbaagu','hamburg steak','food'],['ごはん','gohan','rice / meal','food'],['パン','pan','bread','food'],
 ['たまご','tamago','egg','food'],['やさい','yasai','vegetables','food'],['おにく','oniku','meat','food'],['みず','mizu','water','food'],
 ['おちゃ','ocha','tea','food'],['コーヒー','koohii','coffee','food'],['ビール','biiru','beer','food'],['ハイボール','haibooru','highball (whisky soda)','food'],
 ['にほんしゅ','nihonshu','sake (rice wine)','food'],['メニュー','menyuu','menu','food'],['おかいけい','okaikei','the bill','food'],['おいしい','oishii','delicious','food'],
 ['さかな','sakana','fish (avoid!)','food',true],['えび','ebi','shrimp (avoid!)','food',true],['かに','kani','crab (avoid!)','food',true],['いか','ika','squid (avoid!)','food',true],
 ['たこ','tako','octopus (avoid!)','food',true],['のり','nori','seaweed (avoid!)','food',true],['かまぼこ','kamaboko','fish cake (avoid!)','food',true],['だし','dashi','stock (usually fish, check!)','food',true],
 ['えき','eki','train station','go'],['でんしゃ','densha','train','go'],['ちかてつ','chikatetsu','subway','go'],['タクシー','takushii','taxi','go'],
 ['バス','basu','bus','go'],['きっぷ','kippu','ticket','go'],['ホーム','hoomu','platform','go'],['のりかえ','norikae','transfer','go'],
 ['しゅうでん','shuuden','last train','go'],['くうこう','kuukou','airport','go'],['しんかんせん','shinkansen','bullet train','go'],['でぐち','deguchi','exit','go'],
 ['いりぐち','iriguchi','entrance','go'],['みぎ','migi','right','go'],['ひだり','hidari','left','go'],['まっすぐ','massugu','straight ahead','go'],
 ['コンビニ','konbini','convenience store','shop'],['おかね','okane','money','shop'],['カード','kaado','credit card','shop'],['げんきん','genkin','cash','shop'],
 ['レシート','reshiito','receipt','shop'],['ふくろ','fukuro','bag','shop'],['めんぜい','menzei','tax-free','shop'],['たかい','takai','expensive','shop'],
 ['やすい','yasui','cheap','shop'],['フィギュア','figyua','figure','shop'],['マンガ','manga','manga','shop'],['アニメ','anime','anime','shop'],
 ['ゲーム','geemu','game','shop'],['コスプレ','kosupure','cosplay','shop'],['ウィッグ','wiggu','wig','shop'],['カメラ','kamera','camera','shop'],
 ['パソコン','pasokon','PC','shop'],['スマホ','sumaho','smartphone','shop'],['じゅうでん','juuden','charging','shop'],['えん','en','yen','shop'],
 ['ホテル','hoteru','hotel','hotel'],['へや','heya','room','hotel'],['かぎ','kagi','key','hotel'],['トイレ','toire','toilet','hotel'],
 ['おふろ','ofuro','bath','hotel'],['シャワー','shawaa','shower','hotel'],['せんたく','sentaku','laundry','hotel'],['エレベーター','erebeetaa','elevator','hotel'],
 ['チェックイン','chekkuin','check-in','hotel'],['にもつ','nimotsu','luggage','hotel'],['ワイファイ','waifai','Wi-Fi','hotel'],
 ['なまえ','namae','name','social'],['ともだち','tomodachi','friend','social'],['かわいい','kawaii','cute','social'],['きれい','kirei','pretty / clean','social'],
 ['たのしい','tanoshii','fun','social'],['すき','suki','like / love','social'],['いっしょに','isshoni','together','social'],['かんぱい','kanpai','cheers','social'],
 ['カラオケ','karaoke','karaoke','social'],['いざかや','izakaya','Japanese pub','social'],['バー','baa','bar','social'],['デート','deeto','date','social'],
 ['れんらくさき','renrakusaki','contact info','social'],['インスタ','insuta','Instagram','social'],['ライン','rain','LINE (app)','social'],['イスラエル','isuraeru','Israel','social'],
 ['イスラエルじん','isuraerujin','Israeli','social'],['しゅみ','shumi','hobby','social'],['しごと','shigoto','job','social'],['えいご','eigo','English','social'],
 ['にほんご','nihongo','Japanese','social'],
 ['これ','kore','this (near me)','basic'],['それ','sore','that (near you)','basic'],['あれ','are','that (over there)','basic'],['ここ','koko','here','basic'],
 ['どこ','doko','where','basic'],['いくら','ikura','how much','basic'],['なに','nani','what','basic'],['いつ','itsu','when','basic'],
 ['だれ','dare','who','basic'],['はい','hai','yes','basic'],['いいえ','iie','no','basic'],['ありがとう','arigatou','thank you','basic'],
 ['すみません','sumimasen','excuse me / sorry','basic'],['おねがいします','onegaishimasu','please (requesting)','basic'],['ください','kudasai','please give me','basic'],['だいじょうぶ','daijoubu','OK / fine','basic'],
 ['わかりません','wakarimasen','I don\'t understand','basic'],['ちょっと','chotto','a little','basic'],['おおきい','ookii','big','basic'],['ちいさい','chiisai','small','basic'],
 ['あつい','atsui','hot','basic'],['さむい','samui','cold','basic'],['きょう','kyou','today','basic'],['あした','ashita','tomorrow','basic'],
 ['いま','ima','now','basic'],['よる','yoru','night','basic'],['あさ','asa','morning','basic'],
 ['いち','ichi','1','num'],['に','ni','2','num'],['さん','san','3','num'],['よん','yon','4','num'],['ご','go','5','num'],['ろく','roku','6','num'],
 ['なな','nana','7','num'],['はち','hachi','8','num'],['きゅう','kyuu','9','num'],['じゅう','juu','10','num'],['ひゃく','hyaku','100','num'],['せん','sen','1000','num']
].map(v=>({jp:v[0],r:v[1],en:v[2],cat:v[3],warn:!!v[4]}));
const CATLABEL={food:'Food',go:'Transport',shop:'Shopping',hotel:'Hotel',social:'Social',basic:'Basics & questions',num:'Numbers'};

const PARTICLES=new Set(['は','を','が','に','の','か','まで','と','って','で','な','よ','ね']);
// slot templates, rewritten to how people actually say them (particles dropped where natives drop them)
const SENT=[
 {t:['SLOT','ください'],r:'X kudasai',en:'X, please',reg:'staff',note:'No を. Natives drop the object particle when ordering.',slot:v=>['food','shop'].includes(v.cat)&&!v.warn},
 {t:['SLOT','って','どこ','ですか'],r:'X tte doko desu ka',en:'Where is X?',reg:'staff',note:'って marks "the thing called X". Way more natural than は when asking about a place.',slot:v=>['go','hotel'].includes(v.cat)||['コンビニ','いざかや','カラオケ'].includes(v.jp)},
 {t:['これ','いくら','ですか'],r:'kore ikura desu ka',en:'How much is this?',reg:'staff',note:'Point and ask. No は needed.',slot:v=>false},
 {t:['これ','SLOT','ですか'],r:'kore X desu ka',en:'Is this X?',reg:'staff',note:'Checking a menu item before ordering. Handy for spotting fish.',slot:v=>v.cat==='food'&&v.jp!=='おいしい'},
 {t:['SLOT','けっこう','すき'],r:'X kekkou suki',en:'I quite like X',reg:'casual',note:'けっこう = quite / pretty. No です, no が. This is how friends talk.',slot:v=>['food','shop','social'].includes(v.cat)&&!v.warn&&!['すき','なまえ'].includes(v.jp)},
 {t:['SLOT','いきたい','な'],r:'X ikitai na',en:'I wanna go to X',reg:'casual',note:'な at the end makes it a thought said out loud. Textbook version has に and です; friends do not.',slot:v=>['コンビニ','いざかや','カラオケ','バー','イスラエル','くうこう'].includes(v.jp)},
 {t:['SLOT','ありますか'],r:'X arimasu ka',en:'Do you have X?',reg:'staff',note:'Just the noun plus ありますか. Dropping は is normal.',slot:v=>['ワイファイ','メニュー','ふくろ','トイレ','ビール','やさい','たまご','おちゃ','コーヒー','からあげ'].includes(v.jp)},
 {t:['SLOT','おねがいします'],r:'X onegaishimasu',en:'X, please (ordering)',reg:'staff',note:'Ordering or asking for the bill. No を.',slot:v=>['food'].includes(v.cat)&&!v.warn||['おかいけい','チェックイン','レシート'].includes(v.jp)},

function splitTiles(jp){return jp.replace(/([、。？！])(?=\S)/g,'$1 ').split(' ').filter(Boolean)}
function glossOf(t){if(t==='？')return '?';const k=t.replace(/[、。？！]/g,'');if(!k)return '';const v=VOCAB.find(x=>x.jp===k);return v?v.en.replace(/ \(.*\)/,''):(GLOSS[k]||'')}
function glossTable(tiles){return `<div class="gloss">${tiles.map(t=>`<div class="g"><div class="gj ja">${t}</div><div class="ge">${esc(glossOf(t)||'?')}</div></div>`).join('')}</div>`}

function weight(id){const p=PROG[id];if(!p)return 3;return (1+2*p.b)/(1+p.s)}
function pick(items,idf,avoid){let tot=0;const w=items.map(it=>{const x=weight(idf(it))*(idf(it)===avoid?0.15:1);tot+=x;return x});let r=Math.random()*tot;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[items.length-1]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

   .replace(/sh/g,'sy').replace(/ch/g,'ty').replace(/j([aeiou])/g,'zy$1').replace(/nn/g,'n');return s}

  d.innerHTML=`<h2>What to drill</h2><div id="scr">
   <span class="chip ${store.script==='h'?'on':''}" data-s="h">hiragana</span><span class="chip ${store.script==='k'?'on':''}" data-s="k">katakana</span><span class="chip ${store.script==='both'?'on':''}" data-s="both">both</span></div>
   <div id="rows">${Object.keys(ROWLABEL).map(k=>`<span class="chip ${store.rows.has(k)?'on':''}" data-r="${k}">${ROWLABEL[k]}</span>`).join('')}</div>
   <div class="row"><button class="btn small" id="all">All</button><button class="btn small" id="basic">Basic 46 only</button></div>`;
  d.querySelector('#scr').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;store.script=c.dataset.s;cb()};
  d.querySelector('#rows').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const r=c.dataset.r;store.rows.has(r)?store.rows.delete(r):store.rows.add(r);if(!store.rows.size)store.rows.add(r);cb()};
  d.querySelector('#all').onclick=()=>{store.rows=new Set(Object.keys(ROWLABEL));cb()};
  d.querySelector('#basic').onclick=()=>{store.rows=new Set(HROWS.map(r=>r[0]));cb()};
  m.appendChild(d);
}
function kanaPool(){const out=[];KANA.filter(k=>store.rows.has(k.row)).forEach(k=>{if(store.script!=='k')out.push({id:'h:'+k.h,ch:k.h,r:k.r,row:k.row});if(store.script!=='h')out.push({id:'k:'+k.k,ch:k.k,r:k.r,row:k.row})});return out}
function progBar(pool){const n=pool.filter(x=>PROG[x.id]&&PROG[x.id].s>=3).length;return `<div class="hint">Mastered ${n} of ${pool.length} (3 correct in a row)</div><div class="bar"><i style="width:${Math.round(100*n/pool.length)}%"></i></div>`}

/* ---------- KANA READING ---------- */
function kana(m){
  kanaSettings(m,()=>render());
  const pool=kanaPool();if(pool.length<4){m.insertAdjacentHTML('beforeend','<div class="card"><p>Pick at least one row.</p></div>');return}
  const it=pick(pool,x=>x.id,lastId);lastId=it.id;
  const same=pool.filter(x=>x.r!==it.r);const near=shuffle(same.filter(x=>x.row===it.row));const others=shuffle(same);
  const dis=[];const seen=new Set([it.r]);for(const x of near.concat(others)){if(!seen.has(x.r)){seen.add(x.r);dis.push(x.r)}if(dis.length===3)break}
  const opts=shuffle([it.r,...dis]);
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="big ja">${it.ch}</div>${itemStat(it.id)}<div class="choices">${opts.map(o=>`<button class="opt" data-r="${o}">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button></div>`;
  m.appendChild(c);
  choiceFlow(c,opts,b=>b.dataset.r===it.r,good=>finish(c,good,good?'Correct':`No. ${it.ch} = ${it.r}`,it.id,it.ch));
  m.insertAdjacentHTML('beforeend',`<div class="card"><p class="hint">Mistakes come back more often. Basic 46 + dakuten (the dots: ga, za, da, ba, pa) + combos (kya, sha, cho).</p>${progBar(pool)}</div>`);
}

/* ---------- KANA TYPING ---------- */
function kanatype(m){
  kanaSettings(m,()=>render());
  const pool=kanaPool();const it=pick(pool,x=>x.id,lastId);lastId=it.id;
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="big ja">${it.ch}</div>${itemStat(it.id)}<input type="text" id="inp" placeholder="type the romaji" autocomplete="off" autocapitalize="off"><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button><button class="btn" id="skip">Reveal</button></div>`;
  m.appendChild(c);const inp=c.querySelector('#inp');inp.focus();let done=false;
  const alts=[it.r,...(ALT[it.r]||[])];
  c.querySelector('#chk').onclick=()=>{if(done)return;const v=inp.value.trim();if(!v){inp.focus();return}done=true;const good=alts.some(a=>norm(a)===norm(v));finish(c,good,good?'Correct':`No. ${it.ch} = ${it.r}`,it.id,it.ch)};
  c.querySelector('#skip').onclick=()=>{if(done)return;done=true;finish(c,false,`${it.ch} = ${it.r}`,it.id,it.ch)};
  m.insertAdjacentHTML('beforeend',`<div class="card">${progBar(pool)}</div>`);
}

/* ---------- VOCAB ---------- */
function vocabSettings(m){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<h2>Words</h2><div id="vm">
   <span class="chip ${store.vocabMode==='read'?'on':''}" data-v="read">Read: kana word, type romaji</span>
   <span class="chip ${store.vocabMode==='mean'?'on':''}" data-v="mean">Meaning: kana word, pick the English</span>
   <span class="chip ${store.vocabMode==='rev'?'on':''}" data-v="rev">Reverse: English, pick the kana</span></div>
   <div id="cats">${Object.keys(CATLABEL).map(k=>`<span class="chip ${store.cats.has(k)?'on':''}" data-c="${k}">${CATLABEL[k]}</span>`).join('')}</div>`;
  d.querySelector('#vm').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;store.vocabMode=c.dataset.v;render()};
  d.querySelector('#cats').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.c;store.cats.has(k)?store.cats.delete(k):store.cats.add(k);if(!store.cats.size)store.cats.add(k);render()};
  m.appendChild(d);
}
function vocab(m){
  vocabSettings(m);
  const pool=VOCAB.filter(v=>store.cats.has(v.cat));const it=pick(pool,x=>'v:'+x.jp,lastId);lastId='v:'+it.jp;const id='v:'+it.jp;
  const c=document.createElement('div');c.className='card';m.appendChild(c);
  const warn=it.warn?`<div class="meaning warn">Hidden-fish warning</div>`:'';
  const result=good=>`<div class="romaji">${it.jp} = ${it.r}</div><div class="meaning">${esc(it.en)}</div>${warn}`;
  if(store.vocabMode==='read'){
    c.innerHTML=`<div class="word ja">${it.jp}</div>${itemStat(id)}<input type="text" id="inp" placeholder="type the romaji" autocomplete="off" autocapitalize="off"><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button><button class="btn" id="skip">Reveal</button></div>`;
    const inp=c.querySelector('#inp');inp.focus();let done=false;
    c.querySelector('#chk').onclick=()=>{if(done)return;const v=inp.value.trim();if(!v){inp.focus();return}done=true;finish(c,romMatch(v,it.r),result(),id,it.jp)};
    c.querySelector('#skip').onclick=()=>{if(done)return;done=true;finish(c,false,result(),id,it.jp)};
  }else{
    const rev=store.vocabMode==='rev';
    const dis=shuffle(pool.filter(x=>x.jp!==it.jp&&x.en!==it.en)).slice(0,3);const opts=shuffle([it,...dis]);
    c.innerHTML=(rev?`<div class="meaning" style="font-size:30px;margin:14px 0 20px">${esc(it.en)}</div>`:`<div class="word ja">${it.jp}</div>`)+itemStat(id)+
      `<div class="choices">${opts.map(o=>rev?`<button class="opt ja" data-j="${o.jp}">${o.jp}</button>`:`<button class="opt" data-j="${o.jp}" style="font-size:16px">${esc(o.en)}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button></div>`;
    choiceFlow(c,opts,b=>b.dataset.j===it.jp,good=>finish(c,good,result(),id,it.jp));
  }
  m.insertAdjacentHTML('beforeend',`<div class="card"><p class="hint">Words marked (avoid!) are there on purpose: the goal is to recognize them on a menu before ordering.</p>${progBar(pool.map(v=>({id:'v:'+v.jp})))}</div>`);
}

/* ---------- SENTENCES ---------- */
function sentSettings(m){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<h2>Sentences</h2><div id="sm">
   <span class="chip ${store.sentMode==='order'?'on':''}" data-v="order">Order the tiles</span>
   <span class="chip ${store.sentMode==='read'?'on':''}" data-v="read">Read: kana, type romaji</span>
   <span class="chip ${store.sentMode==='build'?'on':''}" data-v="build">Write: build it in kana</span></div>
   <p class="hint">Everything here is kana only so you can read it. Real Japanese mixes in kanji; the sound and the word order are the same.</p>`;
  d.querySelector('#sm').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;store.sentMode=c.dataset.v;render()};
  m.appendChild(d);
}
function fillTemplate(s){
  const cands=VOCAB.filter(s.slot);const x=cands[Math.floor(Math.random()*cands.length)];
  let y=null;if(s.t.includes('SLOT2')){const c2=cands.filter(v=>v.jp!==x.jp);y=c2[Math.floor(Math.random()*c2.length)]}
  const tiles=s.t.map(t=>t==='SLOT'?x.jp:t==='SLOT2'?y.jp:t);
  const rom=tiles.map(t=>t===x.jp?x.r:(y&&t===y.jp)?y.r:EXTRA_ROM[t]||t).join(' ').replace(' ?','?');
  let en=s.en.replace('X',x.en.replace(/ \(.*\)/,''));if(y)en=en.replace('Y',y.en.replace(/ \(.*\)/,''));
  return {tiles,r:rom,en,reg:s.reg,note:s.note,id:'s:'+s.r,jp:tiles.join(' ')};
}
function pickSentence(){
  if(store.sentMode==='order'&&Math.random()<0.3){const ts=SENT.filter(s=>s.t.includes('SLOT'));return fillTemplate(pick(ts,s=>'s:'+s.r,lastId))}
  const b=pick(BANK,x=>'b:'+x.jp,lastId);return {tiles:splitTiles(b.jp),r:b.r,en:b.en,reg:b.reg,note:b.note,id:'b:'+b.jp,jp:b.jp};
}
function sentResult(p,good,lead){return `${lead}<span class="ja">${p.tiles.join(' ')}</span><div class="romaji">${p.r}</div>${glossTable(p.tiles)}<div class="note"><b>What this teaches:</b> ${esc(p.note)}</div>`}
function sent(m){
  sentSettings(m);
  const p=pickSentence();lastId=p.id;const say=p.tiles.join('').replace(/[？]/g,'');
  const c=document.createElement('div');c.className='card';m.appendChild(c);
  const reg=`<span class="reg">${REGLABEL[p.reg]}</span>`;
  if(store.sentMode==='order'){
    c.innerHTML=`<h2>Put it in order ${reg}</h2><div class="meaning">${esc(p.en)}</div>${itemStat(p.id)}<div class="romaji" id="rh"><button class="btn small" id="hint">Romaji hint</button></div>
     <div class="tiles" id="ans"></div><div class="tiles" id="bank" style="border-style:solid">${shuffle(p.tiles.map((t,i)=>({t,i}))).map(o=>`<button class="tile ja ${PARTICLES.has(o.t)?'part':''}" data-i="${o.i}">${o.t}</button>`).join('')}</div>
     <div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk" disabled>Check <span class="keyhint">Enter</span></button><button class="btn" id="undo">Undo last <span class="keyhint">Backspace</span></button><button class="btn" id="next">Skip</button></div>
     <p class="hint">Blue = particles and sentence-final bits (は を が に で って な よ ね). Tap a placed tile to send it back.</p>`;
    const ans=c.querySelector('#ans'),bank=c.querySelector('#bank'),chk=c.querySelector('#chk');const order=[];let done=false;
    const upd=()=>{chk.disabled=order.length!==p.tiles.length};
    bank.onclick=e=>{const b=e.target.closest('.tile');if(!b||done)return;sfxTap();b.classList.add('used');order.push(+b.dataset.i);const n=b.cloneNode(true);n.classList.remove('used');ans.appendChild(n);upd()};
    ans.onclick=e=>{const b=e.target.closest('.tile');if(!b||done)return;sfxTap();const i=+b.dataset.i;order.splice(order.indexOf(i),1);b.remove();bank.querySelector(`[data-i="${i}"]`).classList.remove('used');upd()};
    c.querySelector('#undo').onclick=()=>{if(done||!order.length)return;const i=order.pop();ans.lastChild.remove();bank.querySelector(`[data-i="${i}"]`).classList.remove('used');upd()};
    c.querySelector('#hint').onclick=()=>{c.querySelector('#rh').textContent=p.r};
    c.querySelector('#next').onclick=render;
    chk.onclick=()=>{if(done||order.length!==p.tiles.length)return;done=true;const good=order.every((v,i)=>v===i);
      [...ans.children].forEach((t,i)=>{t.style.borderColor=order[i]===i?'var(--ok)':'var(--bad)'});
      finish(c,good,sentResult(p,good,good?'Correct. ':'No. Correct order: '),p.id,say)};
  }else if(store.sentMode==='read'){
    c.innerHTML=`<h2>Read it ${reg}</h2><div class="word ja" style="font-size:40px">${p.tiles.join(' ')}</div>${itemStat(p.id)}<input type="text" id="inp" placeholder="type the romaji" autocomplete="off" autocapitalize="off"><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button><button class="btn" id="skip">Reveal</button></div>`;
    const inp=c.querySelector('#inp');inp.focus();let done=false;
    const cmp=(a,b)=>romMatch(a.replace(/[?!.,]/g,''),b.replace(/[?!.,]/g,''));
    c.querySelector('#chk').onclick=()=>{if(done)return;const v=inp.value.trim();if(!v){inp.focus();return}done=true;const good=cmp(v,p.r);finish(c,good,sentResult(p,good,good?'Correct. ':'Not quite. ')+`<div class="meaning">${esc(p.en)}</div>`,p.id,say)};
    c.querySelector('#skip').onclick=()=>{if(done)return;done=true;finish(c,false,sentResult(p,false,'')+`<div class="meaning">${esc(p.en)}</div>`,p.id,say)};
  }else{
    const target=p.tiles.join('').replace(STRIP,'');const chars=[...target];
    const extras=shuffle(KANA.map(k=>target.match(/[ァ-ン]/)?k.k:k.h).filter(ch=>!target.includes(ch))).slice(0,4);
    const pad=shuffle(chars.concat(extras));
    c.innerHTML=`<h2>Write it in kana ${reg}</h2><div class="meaning">${esc(p.en)}</div><div class="romaji">${p.r}</div>${itemStat(p.id)}<div class="built ja" id="built"></div>
     <div class="pad ja" id="pad">${pad.map((ch,i)=>`<button data-i="${i}" data-ch="${ch}">${ch}</button>`).join('')}</div>
     <div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk" disabled>Check <span class="keyhint">Enter</span></button><button class="btn" id="undo">Undo last <span class="keyhint">Backspace</span></button><button class="btn" id="next">Skip</button></div>
     <p class="hint">Tap the kana in order. Four of the keys are decoys. Small っ ゃ ゅ ょ and the ー bar count as their own characters.</p>`;
    const built=c.querySelector('#built'),padEl=c.querySelector('#pad'),chk=c.querySelector('#chk');const seq=[];let done=false;
    const upd=()=>{built.textContent=seq.map(i=>pad[i]).join('');chk.disabled=seq.length===0};
    padEl.onclick=e=>{const b=e.target.closest('button');if(!b||done)return;const i=+b.dataset.i;if(seq.includes(i))return;sfxTap();seq.push(i);b.disabled=true;upd()};
    c.querySelector('#undo').onclick=()=>{if(done||!seq.length)return;const i=seq.pop();padEl.querySelector(`[data-i="${i}"]`).disabled=false;upd()};
    c.querySelector('#next').onclick=render;
    chk.onclick=()=>{if(done||!seq.length)return;done=true;const got=seq.map(i=>pad[i]).join('');const good=got===target;
      finish(c,good,sentResult(p,good,good?'Correct. ':`No. You wrote <span class="ja">${got}</span>. It is: `),p.id,say)};
  }
  m.insertAdjacentHTML('beforeend',`<div class="card">${progBar(BANK.map(b=>({id:'b:'+b.jp})))}<p class="hint">${BANK.length} native-sounding sentences plus ${SENT.length} slot patterns. Casual ones are for friends and dates; "with staff" ones are polite but the way locals actually phrase them.</p></div>`);
}

/* ---------- TALK ---------- */
function talk(m){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<h2>Talk: they ask, you answer</h2><div id="tm">
   <span class="chip ${store.talkMode==='answer'?'on':''}" data-v="answer">Answer freely, then compare</span>
   <span class="chip ${store.talkMode==='build'?'on':''}" data-v="build">Build the answer from tiles</span>
   <span class="chip ${store.talkMode==='chat'?'on':''}" data-v="chat">5-question chat</span></div>
   <p class="hint">These are the questions you will actually get at an izakaya or on a date. Answers are written in your voice (Israel, video work, anime, solo trip). ＿＿ means fill in your own.</p>`;
  d.querySelector('#tm').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;store.talkMode=c.dataset.v;store.chat=null;render()};
  m.appendChild(d);
  let q,pos='';
  if(store.talkMode==='chat'){if(!store.chat||store.chat.i>=5){store.chat={qs:shuffle(CONV).slice(0,5),i:0,ok:0}}q=store.chat.qs[store.chat.i];pos=`Question ${store.chat.i+1} of 5`}
  else{q=pick(CONV,x=>'q:'+x.q,lastId)}
  const id='q:'+q.q;lastId=id;const qsay=q.q.replace(/[ ？]/g,'');
  const c=document.createElement('div');c.className='card';m.appendChild(c);
  const ansHtml=q.a.map((a,i)=>`<div class="ans"><div class="a ja">${a[0]}</div><div class="ar">${a[1]}</div><div class="ae">${esc(a[2])}</div>${glossTable(splitTiles(a[0]))}<div class="hint">${esc(a[3])}</div>${canSpeak?`<button class="btn small" data-say="${a[0].replace(/[ ？＿]/g,'')}" style="margin-top:6px">Listen</button>`:''}</div>`).join('');
  if(store.talkMode!=='build'){
    c.innerHTML=`${pos?`<div class="hint">${pos}</div>`:''}<div class="qbox ja">${q.q}</div><div class="romaji" id="qr"><button class="btn small" id="showr">Romaji + meaning</button>${canSpeak?' <button class="btn small" id="sayq">Listen</button>':''}</div>${itemStat(id)}
     <p class="hint" style="margin-top:12px">Say it out loud, then type your answer in romaji (or just a keyword) so you commit before peeking.</p>
     <textarea id="mine" placeholder="your answer"></textarea>
     <div id="model" style="display:none"><p><b>How you could say it:</b></p>${ansHtml}</div>
     <div class="feedback" id="fb"></div>
     <div class="row actions"><button class="btn gold" id="chk">Show answers <span class="keyhint">Enter</span></button><button class="btn" id="next">Skip</button></div>
     <div class="row" id="grade" style="display:none"><span>Could you have said something like that?</span><button class="btn" id="yes">Yes</button><button class="btn" id="no">Not yet</button></div>`;
    c.querySelector('#showr').onclick=e=>{c.querySelector('#qr').innerHTML=`${q.qr}<div class="meaning" style="font-size:16px">${esc(q.qe)}</div>${glossTable(splitTiles(q.q))}`};
    const sq=c.querySelector('#sayq');if(sq)sq.onclick=()=>speak(qsay);
    c.querySelector('#next').onclick=()=>{if(store.chat)store.chat.i++;render()};
    c.querySelector('#chk').onclick=()=>{c.querySelector('#model').style.display='block';c.querySelector('#grade').style.display='flex';c.querySelector('#chk').disabled=true;c.querySelector('#qr').innerHTML=`${q.qr}<div class="meaning" style="font-size:16px">${esc(q.qe)}</div>${glossTable(splitTiles(q.q))}`;sfxTap()};
    c.onclick=e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)};
    const after=good=>{c.querySelector('#grade').style.display='none';if(store.chat){store.chat.i++;if(good)store.chat.ok++;const last=store.chat.i>=5;finish(c,good,last?`Chat done: ${store.chat.ok} of 5 answered comfortably.`:(good?'Nice':'It will come back'),id,qsay);if(last){c.querySelector('#nextBtn').textContent='New chat'}}else finish(c,good,good?'Nice':'It will come back',id,qsay)};
    c.querySelector('#yes').onclick=()=>after(true);c.querySelector('#no').onclick=()=>after(false);
    const ta=c.querySelector('#mine');ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const b=c.querySelector('#chk:not([disabled])')||c.querySelector('#nextBtn');if(b)b.click()}};
  }else{
    const a=q.a[Math.floor(Math.random()*q.a.length)];const tiles=splitTiles(a[0]);const say=a[0].replace(/[ ？＿]/g,'');
    c.innerHTML=`<div class="qbox ja" style="font-size:26px">${q.q}</div><div class="romaji">${q.qr} <span class="hint">(${esc(q.qe)})</span></div>${itemStat(id)}
     <p><b>Your answer:</b> ${esc(a[2])}</p><div class="romaji" id="rh"><button class="btn small" id="hint">Romaji hint</button></div>
     <div class="tiles" id="ans"></div><div class="tiles" id="bank" style="border-style:solid">${shuffle(tiles.map((t,i)=>({t,i}))).map(o=>`<button class="tile ja ${PARTICLES.has(o.t)?'part':''}" data-i="${o.i}">${o.t}</button>`).join('')}</div>
     <div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk" disabled>Check <span class="keyhint">Enter</span></button><button class="btn" id="undo">Undo last <span class="keyhint">Backspace</span></button><button class="btn" id="next">Skip</button></div>`;
    const ans=c.querySelector('#ans'),bank=c.querySelector('#bank'),chk=c.querySelector('#chk');const order=[];let done=false;
    const upd=()=>{chk.disabled=order.length!==tiles.length};
    bank.onclick=e=>{const b=e.target.closest('.tile');if(!b||done)return;sfxTap();b.classList.add('used');order.push(+b.dataset.i);const n=b.cloneNode(true);n.classList.remove('used');ans.appendChild(n);upd()};
    ans.onclick=e=>{const b=e.target.closest('.tile');if(!b||done)return;sfxTap();const i=+b.dataset.i;order.splice(order.indexOf(i),1);b.remove();bank.querySelector(`[data-i="${i}"]`).classList.remove('used');upd()};
    c.querySelector('#undo').onclick=()=>{if(done||!order.length)return;const i=order.pop();ans.lastChild.remove();bank.querySelector(`[data-i="${i}"]`).classList.remove('used');upd()};
    c.querySelector('#hint').onclick=()=>{c.querySelector('#rh').textContent=a[1]};
    c.querySelector('#next').onclick=render;
    chk.onclick=()=>{if(done||order.length!==tiles.length)return;done=true;const good=order.every((v,i)=>v===i);
      [...ans.children].forEach((t,i)=>{t.style.borderColor=order[i]===i?'var(--ok)':'var(--bad)'});
      finish(c,good,(good?'Correct. ':'No. It goes: ')+`<span class="ja">${tiles.join(' ')}</span><div class="romaji">${a[1]}</div>${glossTable(tiles)}<div class="note"><b>Note:</b> ${esc(a[3])}</div>`,id,say)};

}

/* ---------- LESSONS: the how and why of each form ---------- */
const LESSONS={
 dict:{why:'The form you find in a dictionary. It is also the casual present and future: "I drink", "I will drink". Friends use it all day; it is not rude, it is relaxed. Everything else is built from it.',
  how:['u-verbs end in an u-sound kana (う く ぐ す つ ぬ ぶ む る)','ru-verbs end in いる / える (たべる, みる)','する and くる are the two irregulars'],
  ex:[['あした のむ？','ashita nomu?','Drinking tomorrow?'],['まいにち にほんご を べんきょう する。','mainichi nihongo o benkyou suru','I study Japanese every day.']]},
 masu:{why:'The polite present. Staff, strangers, someone older, a first meeting. It does not change the meaning, only the distance. Switching from ます to plain form with someone is how you signal "we are friends now".',
  how:['u-verb: last kana slides to the i-column, add ます: のむ → のみます, かく → かきます','ru-verb: drop る, add ます: たべる → たべます','する → します, くる → きます'],
  ex:[['ビール のみます か？','biiru nomimasu ka','Will you have a beer? (polite)'],['あした きます。','ashita kimasu','I will come tomorrow.']]},
 nai:{why:'Casual "not". Also the base for "gotta" (なきゃ) and for the friendly invitation "won\'t you...?" (いかない？). Asking with a negative is the native way to invite because it leaves the other person an easy out.',
  how:['u-verb: last kana slides to the a-column, add ない: のむ → のまない, かく → かかない. Verbs ending in う go to わ: あう → あわない','ru-verb: drop る, add ない: たべる → たべない','する → しない, くる → こない, ある → ない (not あらない)'],
  ex:[['さかな は たべない。','sakana wa tabenai','I don\'t eat fish.'],['いっしょ に いかない？','issho ni ikanai?','Wanna come along?']]},
 masen:{why:'Polite "not". Same job as ない with the distance of ます. Also the polite way to invite: いきませんか = won\'t you go? (a bit stiff between friends, fine with anyone else).',
  how:['Take the ます form and swap ます for ません: のみます → のみません','する → しません, くる → きません'],
  ex:[['わかりません。','wakarimasen','I don\'t understand. (polite)'],['カード は つかえません。','kaado wa tsukaemasen','Cards can\'t be used.']]},
 ta:{why:'Casual past: "I ate", "I went". Also how Japanese says a current state that resulted from a change: おなか すいた (my stomach became empty = I\'m hungry), つかれた (I got tired = I\'m tired). And with こと ある it means "have ever": たべた こと ある？',
  how:['Same rule as the te-form, with て → た and で → だ: のんで → のんだ, かいて → かいた, はなして → はなした','ru-verb: drop る, add た: たべる → たべた','する → した, くる → きた, いく → いった'],
  ex:[['きのう ラーメン たべた。','kinou raamen tabeta','I had ramen yesterday.'],['おなか すいた。','onaka suita','I\'m hungry.']]},
 mashita:{why:'Polite past. Ordering was done, arriving happened, with distance. Also fixed expressions: わかりました (understood), おまたせ しました (sorry to keep you waiting).',
  how:['Take the ます form and swap ます for ました: のみます → のみました','する → しました, くる → きました'],
  ex:[['きのう つきました。','kinou tsukimashita','I arrived yesterday. (polite)'],['わかりました。','wakarimashita','Got it. (polite)']]},
 nakatta:{why:'Casual "didn\'t". Built on the ない form, because in Japanese ない behaves like an い-adjective and い-adjectives make their past with かった.',
  how:['Make the ない form, replace ない with なかった: のまない → のまなかった','する → しなかった, くる → こなかった, ある → なかった'],
  ex:[['きのう は のまなかった。','kinou wa nomanakatta','I didn\'t drink yesterday.'],['じかん が なかった。','jikan ga nakatta','There was no time.']]},
 masendeshita:{why:'Polite "didn\'t". The polite negative ません plus でした, the polite past of です. Long, but completely regular: every verb does exactly this. わかりませんでした = I didn\'t understand.',
  how:['Take the ません form and add でした: のみません → のみませんでした','する → しませんでした, くる → きませんでした'],
  ex:[['きのう は いきませんでした。','kinou wa ikimasen deshita','I didn\'t go yesterday. (polite)'],['わかりませんでした。','wakarimasen deshita','I didn\'t understand. (polite)']]},
 nakereba:{why:'"Have to", polite and actually spoken. Textbooks teach なければ なりません, but in real conversation that sounds stiff and written. What people say to be polite is ないと いけません (たべないと いけません). You will also hear なきゃ いけません and なくちゃ いけません, the same thing with the casual clip inside; they are fine in relaxed polite speech. Keep なければ なりません for forms, signs and formal writing.',
  how:['Make the ない form, add と いけません: いかない → いかないと いけません, たべない → たべないと いけません','する → しないと いけません, くる → こないと いけません','Same idea, slightly more casual: なきゃ いけません / なくちゃ いけません. Formal written: なければ なりません'],
  ex:[['もう かえらないと いけません。','mou kaeranai to ikemasen','I have to go home now. (polite)'],['パスポート を もたないと いけません。','pasupooto o motanai to ikemasen','You have to carry your passport. (polite)'],['あした はやく おきなきゃ いけません。','ashita hayaku okinakya ikemasen','I have to get up early tomorrow. (relaxed polite)']]},
 te:{why:'The connector. It does not mean anything on its own; it links a verb to what comes next. te + ください = please do. te + いい？ = may I? te on its own = casual request (まって = wait). te + いる = doing. te + みる = try doing. If you learn one form well, learn this one.',
  how:['u-verb by last kana: う つ る → って (あう → あって, まつ → まって, のる → のって), む ぶ ぬ → んで (のむ → のんで, あそぶ → あそんで), く → いて (かく → かいて), ぐ → いで (およぐ → およいで), す → して (はなす → はなして)','ru-verb: drop る, add て: たべる → たべて','する → して, くる → きて, and the one exception: いく → いって'],
  ex:[['ちょっと まって。','chotto matte','Hang on a sec.'],['しゃしん とって いい？','shashin totte ii?','Can I take a photo?'],['あっためて ください。','attamete kudasai','Please heat it up.']]},
 tekudasai:{why:'The polite request: te-form + ください. "Please do X." With staff, drivers, hosts: まってください (please wait), あっためてください (please heat it up). Between friends you drop ください and just say the te-form: まって.',
  how:['Make the te-form, add ください: まって → まってください, たべて → たべてください','する → してください, くる → きてください','Softer: てもらえますか (could you...?)'],
  ex:[['ここ で おろしてください。','koko de oroshite kudasai','Please let me off here.'],['もう いちど いってください。','mou ichido itte kudasai','Please say it once more.']]},
 teru:{why:'Casual "-ing" and casual "is in a state". The full form is ている (たべている); in speech everyone drops the い (たべてる). Both are the same form; you will read ている and hear てる. It covers both "I am eating now" (たべてる) and states that continue: しってる (I know), すんでる (I live), けっこん してる (is married), もってる (I have on me).',
  how:['Make the te-form, add る: のんで → のんでる, たべて → たべてる','Polite version: te + います → のんでいます (or のんでます in relaxed polite speech)'],
  ex:[['いま なに してる？','ima nani shiteru?','What are you doing?'],['えき で まってる。','eki de matteru','I\'m waiting at the station.'],['しってる！','shitteru!','I know!']]},
 teimasu:{why:'Polite "-ing" and polite "is in a state". The same ている form with います on the end. With staff and strangers: まっています (I am waiting), しっています (I know). In relaxed polite speech the い drops here too: まってます.',
  how:['Make the te-form, add います: のんで → のんでいます, たべて → たべています','Relaxed: てます (い dropped)','する → しています, くる → きています'],
  ex:[['えき で まっています。','eki de matte imasu','I am waiting at the station. (polite)'],['しんじゅく に とまっています。','shinjuku ni tomatte imasu','I am staying in Shinjuku. (polite)']]},
 teta:{why:'Casual "was -ing" or "had been". The past of てる. Perfect for "what did you do today": まち を あるいてた (was walking around town). Also for something that was the case earlier: わすれてた (I had forgotten).',
  how:['Make the te-form, add た: のんで → のんでた, たべて → たべてた'],
  ex:[['きょう なに してた の？','kyou nani shiteta no?','What were you up to today?'],['ずっと まってた。','zutto matteta','I was waiting the whole time.']]},
 teimashita:{why:'Polite "was -ing". ています in the past. What you say to staff or someone older when explaining what you were doing: まっていました (I was waiting).',
  how:['Make the te-form, add いました: のんで → のんでいました','Relaxed: てました','する → していました, くる → きていました'],
  ex:[['ずっと まっていました。','zutto matte imashita','I was waiting the whole time. (polite)'],['にほんご を べんきょう していました。','nihongo o benkyou shite imashita','I was studying Japanese. (polite)']]},
 tai:{why:'"I want to". Only for yourself (or asking the listener); for third people Japanese says たがってる. Behaves like an い-adjective, so its negative is たくない and its past is たかった. Softened with な or かな at the end so it does not sound like a demand.',
  how:['u-verb: i-column stem + たい: のむ → のみたい, いく → いきたい','ru-verb: drop る, add たい: たべる → たべたい','する → したい, くる → きたい','Negative: たくない. Past: たかった. Polite: たいです'],
  ex:[['とんかつ たべたい な。','tonkatsu tabetai na','I feel like tonkatsu.'],['ずっと きたかった。','zutto kitakatta','I always wanted to come.'],['かえりたく ない。','kaeritaku nai','I don\'t want to go home.']]},
 taidesu:{why:'"I want to", polite. The verb part is identical (たい); you add です for distance, exactly like an い-adjective (さむい → さむいです). Use it with staff, hosts, anyone older: たべたいです. Never たいます.',
  how:['Make the たい form, add です: たべたい → たべたいです, いきたい → いきたいです','Negative polite: たくないです. Past polite: たかったです'],
  ex:[['きょうと に いきたいです。','kyouto ni ikitai desu','I want to go to Kyoto. (polite)'],['これ を たべたいです。','kore o tabetai desu','I want to eat this. (polite)']]},
 pot:{why:'"Can / be able to". The potential form is its own verb (a ru-verb), so it conjugates again: たべられる → たべられない (can\'t eat), のめます (can drink, polite). In casual speech ru-verbs often drop the ら: たべれる, みれる. Whatever you can do takes が rather than を: にほんご が よめる.',
  how:['u-verb: last kana slides to the e-column, add る: のむ → のめる, はなす → はなせる, いく → いける','ru-verb: drop る, add られる (casual: れる): たべる → たべられる / たべれる','する → できる, くる → こられる / これる'],
  ex:[['さかな は たべられない。','sakana wa taberarenai','I can\'t eat fish.'],['えいご はなせる ひと いますか？','eigo hanaseru hito imasu ka','Anyone who can speak English?'],['カード つかえます か？','kaado tsukaemasu ka','Can I use a card?']]},
 potmasu:{why:'"Can", polite. The potential form is a ru-verb, so it takes ます like any ru-verb: のめる → のめます, つかえる → つかえます. This is the form you use with staff: カード つかえますか, えいご はなせますか.',
  how:['Make the potential form, drop る, add ます: のめる → のめます, たべられる → たべられます','する → できます, くる → こられます','Negative polite: のめません'],
  ex:[['カード つかえます か？','kaado tsukaemasu ka','Can I use a card? (polite)'],['さかな は たべられません。','sakana wa taberaremasen','I can\'t eat fish. (polite)']]},
 vol:{why:'"Let\'s" and "I\'ll". Suggesting to a friend (いこう = let\'s go) or deciding out loud for yourself (かえろう = I\'ll head home). Add か to make it a soft question: いこうか, clipped in speech to いこっか. Polite version is ましょう.',
  how:['u-verb: last kana slides to the o-column, add う: のむ → のもう, いく → いこう, はなす → はなそう','ru-verb: drop る, add よう: たべる → たべよう','する → しよう (clipped: しよ), くる → こよう'],
  ex:[['そろそろ いこっか。','sorosoro ikokka','Shall we get going?'],['ライン こうかん しよ。','rain koukan shiyo','Let\'s swap LINE.'],['たべながら はなそう。','tabenagara hanasou','Let\'s talk while we eat.']]},
 mashou:{why:'"Let\'s", polite. ましょう suggests doing something together with people you are polite with; ましょうか offers to do something for them. Between friends it sounds stiff; with a host, a guide, or a new group it is exactly right.',
  how:['Take the ます form, swap ます for ましょう: いきます → いきましょう, たべます → たべましょう','する → しましょう, くる → きましょう','Offer: ましょうか = shall I?'],
  ex:[['いっしょ に いきましょう。','issho ni ikimashou','Let\'s go together. (polite)'],['しゃしん を とりましょうか？','shashin o torimashou ka','Shall I take a photo (for you)?']]},
 nakya:{why:'"Gotta / have to", casual. The full casual form is ないと いけない or なきゃ いけない; between friends the second half is dropped entirely: いかなきゃ = gotta go, たべなきゃ = gotta eat. なくちゃ works the same way.',
  how:['Make the ない form, replace ない with なきゃ: いかない → いかなきゃ, たべない → たべなきゃ','する → しなきゃ, くる → こなきゃ','Full casual: なきゃ いけない / ないと いけない. Polite: ないと いけません'],
  ex:[['もう いかなきゃ。','mou ikanakya','I gotta go.'],['しゅうでん、いそがなきゃ。','shuuden, isoganakya','Last train, gotta hurry.']]},
};
const ALESSONS={
 plain:{why:'い-adjectives already carry "is" inside them: さむい = it is cold. な-adjectives need だ (or nothing) in casual speech: すき = I like it, ひまだ = I\'m free.',how:['い-adjective: use as is','な-adjective: word + だ, or just the word'],ex:[['きょう さむい ね。','kyou samui ne','Cold today, huh.'],['これ すき。','kore suki','I like this.']]},
 neg:{why:'"Not". い-adjectives drop い and take くない; な-adjectives take じゃない (casual) or ではない (formal). The humble reply to じょうず です ね is ぜんぜん じょうず じゃない.',how:['い: さむい → さむくない, たかい → たかくない','いい is irregular: よくない','な: すき → すきじゃない, きれい → きれいじゃない'],ex:[['たかくない よ。','takakunai yo','It\'s not expensive.'],['ぜんぜん じょうず じゃない。','zenzen jouzu janai','Not good at all.']]},
 past:{why:'"Was". い-adjectives make their own past with かった; な-adjectives use だった. たのしかった is the sentence you say at the end of every good night.',how:['い: おいしい → おいしかった, さむい → さむかった, いい → よかった','な: ひま → ひまだった, きれい → きれいだった'],ex:[['きょう たのしかった。','kyou tanoshikatta','Today was fun.'],['よかった！','yokatta!','Thank goodness / that\'s great!']]},
 pastneg:{why:'"Wasn\'t". Stack the two rules: negative first, then past.',how:['い: さむい → さむくない → さむくなかった','な: ひま → ひまじゃない → ひまじゃなかった'],ex:[['おいしくなかった。','oishikunakatta','It wasn\'t good.'],['ひま じゃなかった。','hima janakatta','I wasn\'t free.']]},
 te:{why:'Linking adjectives: "cheap AND tasty". Same connector role as the verb te-form. Also used for reasons in casual speech: さむくて、ねむい (cold, so sleepy).',how:['い: やすい → やすくて','な: きれい → きれいで'],ex:[['やすくて うまい。','yasukute umai','Cheap and tasty.'],['ひとが やさしくて、まち が きれい。','hito ga yasashikute, machi ga kirei','People are kind and the cities are clean.']]},
 polite:{why:'Add です for distance. That is all. The adjective itself does not change: さむい です, ひま です. Never say さむい だ (だ does not go on い-adjectives).',how:['い: さむい → さむいです','な: ひま → ひまです'],ex:[['おいしい です。','oishii desu','It\'s delicious. (polite)'],['だいじょうぶ です。','daijoubu desu','It\'s fine. (polite)']]},
 sou:{why:'"Looks / seems" from what you see right now. おいしそう = looks delicious (before tasting). いい becomes よさそう. Not for things you were told; that is a different そう.',how:['い: drop い, add そう: おいしい → おいしそう, たかい → たかそう','な: word + そう: ひま → ひまそう','いい → よさそう'],ex:[['おいしそう！','oishisou!','Looks delicious!'],['たかそう。','takasou','Looks pricey.']]},
 sugi:{why:'"Too much". Stack すぎる on the stem and it becomes a ru-verb, so it conjugates: たかすぎる, たかすぎた. In speech the る often drops: あつすぎ！ Works on verb stems too: のみすぎた = drank too much.',how:['い: drop い, add すぎる: あつい → あつすぎる','な: word + すぎる: しずか → しずかすぎる'],ex:[['あつすぎ！','atsusugi!','Way too hot!'],['たかすぎる。','takasugiru','Too expensive.']]},
 adv:{why:'Turning an adjective into "-ly". はやく = quickly / early. な-adjectives take に: しずかに = quietly, きれいに = neatly. Also used before なる to mean "become": さむくなった = it got cold.',how:['い: drop い, add く: はやい → はやく, おそい → おそく','な: word + に: しずか → しずかに'],ex:[['きょう は はやく ねる。','kyou wa hayaku neru','I\'m going to bed early.'],['さむく なった。','samuku natta','It got cold.']]},
};

const TE_CLASS=v=>{const d=v[0],g=v[1];if(g!=='g')return g;if(d.endsWith('いく'))return 'x';const l=d.slice(-1);return 'うつる'.includes(l)?'tte':'むぶぬ'.includes(l)?'nde':'くぐ'.includes(l)?'ite':'shite'};

function ruSuffix(k){const f=conj(['たべる','i'])[k];return f.slice(2)||'nothing'}
function segmentsFor(L){

  const exs=vs=>vs.slice(0,3).map(v=>`${v[0]} → ${(L.adj?conjA(v):conj(v))[k]}`).join(', ');
  if(L.adj){
    const iadj=ADJ.filter(a=>a[1]==='i'&&a[0]!=='いい'),nadj=ADJ.filter(a=>a[1]==='n');
    return [
      {title:'い-adjectives',text:`${Ls.how[0]}. Examples: ${exs(iadj)}.`,pool:iadj},
      {title:'な-adjectives',text:`${Ls.how[Ls.how.length-1]}. Examples: ${exs(nadj)}.`,pool:nadj},
      {title:'いい and mixed',text:`いい is irregular: it becomes よ- in every form (${conjA(['いい','i'])[k]}). Now both kinds together.`,pool:ADJ},
      {title:'Why and when',text:Ls.why,pool:ADJ,why:true}];
  }
  const ich=VERBS.filter(v=>v[1]==='i'),god=VERBS.filter(v=>v[1]==='g'),irr=VERBS.filter(v=>v[1]==='s'||v[1]==='k'||(v[0]==='ある'&&['nai','nakatta','nakya'].includes(k))||(v[0]==='いく'&&TE_FAMILY.includes(k)));
  const segs=[{title:'ru-verbs',text:`ru-verbs (ichidan): chop the る, add ${ruSuffix(k)}. Examples: ${exs(ich)}.`,pool:ich.filter(v=>conj(v)[k])}];
  if(TE_FAMILY.includes(k)){
    const end=conj(['まつ','g'])[k].slice(2);
    const cls=[['tte','う つ る → っ'+end,'u-verbs ending in う, つ or る all take っ'+end+'. This is the biggest group.'],['nde','む ぶ ぬ → ん'+conj(['のむ','g'])[k].slice(2),'u-verbs ending in む, ぶ or ぬ take ん'+conj(['のむ','g'])[k].slice(2)+'. The て becomes で (voiced).'],['ite','く → い'+end+', ぐ → い'+conj(['およぐ','g'])[k].slice(3),'く drops to い'+end+'; ぐ does the same but voiced.'],['shite','す → し'+end,'す-verbs go through し, exactly like the ます stem.']];

/* ---------- CHAT: stay on one topic, 6 to 8 turns ---------- */
function romajiAny(s){const h=[...s].map(c=>{const o=c.codePointAt(0);return (o>=0x30A1&&o<=0x30F6)?String.fromCodePoint(o-0x60):c}).join('');let out='',i=0;
  while(i<h.length){const c=h[i];if(c==='ー'){const m=out.match(/[aeiou](?=[^aeiou]*$)/);out+=m?m[0]:'';i++;continue}
    if(/[、。？！]/.test(c)){out+={ '、':',','。':'.','？':'?','！':'!'}[c];if(i+1<h.length&&h[i+1]!==' ')out+=' ';i++;continue}
    if(c==='を'){out+='o';i++;continue}if(c===' '){out+=' ';i++;continue}
    const two=h.slice(i,i+2);if(H2R[two]){out+=H2R[two];i+=2;continue}
    if(c==='っ'){const n=h.slice(i+1,i+3);const r=H2R[n]||H2R[h[i+1]]||'';out+=r[0]||'';i++;continue}
    if(c==='ん'){out+='n';i++;continue}out+=H2R[c]||c;i++}return out}
function chatId(ti){return 'chat:'+TOPICS[ti].t}
function chatHome(c){
  c.innerHTML=`<h2>Chat: one topic, a whole conversation</h2><p>Pick a topic. The other person speaks first, you answer, then compare with an answer in your voice, then the next line. 6 to 8 turns, same topic all the way. Swap roles to practice asking instead.</p>
   <div class="row" style="margin-bottom:8px"><span class="lab">Your role</span><span class="chip ${store.chatRole!=='ask'?'on':''}" data-role="answer">I answer</span><span class="chip ${store.chatRole==='ask'?'on':''}" data-role="ask">I ask</span>
   <span class="lab" style="margin-left:12px">Input</span><span class="chip ${store.chatInput!=='tiles'?'on':''}" data-inp="type">type / say it</span><span class="chip ${store.chatInput==='tiles'?'on':''}" data-inp="tiles">build from tiles</span></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${TOPICS.map((tp,i)=>{const p=PROG[chatId(i)]||{};const done=p.best||0;return `<div class="kcell" data-i="${i}" style="cursor:pointer;text-align:left;padding:8px 10px"><div style="color:var(--ink)">${esc(tp.t)}</div><div class="hint">${tp.x.length} turns · ${tp.reg==='staff'?'polite':'casual'} ${done?`· best ${done}/${tp.x.length}`:''}</div></div>`}).join('')}</div>`;
  c.onclick=e=>{const r=e.target.closest('[data-role]');if(r){store.chatRole=r.dataset.role;render();return}const inp=e.target.closest('[data-inp]');if(inp){store.chatInput=inp.dataset.inp;render();return}const t=e.target.closest('[data-i]');if(t)chatStart(+t.dataset.i)};
}
function chatStart(ti){store.chat2={ti,i:0,ok:0,log:[]};render()}

  const S=store.chat2,tp=TOPICS[S.ti],ask=store.chatRole==='ask';
  if(S.i>=tp.x.length){const p=pg(chatId(S.ti));p.best=Math.max(p.best||0,S.ok);save();if(S.ok>=tp.x.length-1)sfxStreak();
    c.innerHTML=`<h2>${esc(tp.t)}: done</h2><div class="score">${S.ok} / ${tp.x.length}</div><h2 style="margin-top:12px">The whole conversation</h2>${tp.x.map(x=>`<div class="ans"><div class="hint">them</div><div class="a ja" style="font-size:20px">${x[0]}</div><div class="ar">${romajiAny(x[0])} · ${esc(x[1])}</div><div class="hint" style="margin-top:6px">you</div><div class="a ja" style="font-size:20px">${x[2]}</div><div class="ar">${romajiAny(x[2])} · ${esc(x[3])}</div></div>`).join('')}

  c.innerHTML=`<div class="hint">${esc(tp.t)} · turn ${S.i+1} of ${tp.x.length} · <span class="reg">${tp.reg==='staff'?'polite':'casual'}</span></div><div class="bar"><i style="width:${Math.round(100*S.i/tp.x.length)}%"></i></div>${history?`<div style="margin:8px 0">${history}</div>`:''}${themBlock}${cue}${body}`;
  const reveal=()=>{const qr=c.querySelector('#qr');if(qr)qr.innerHTML=`${romajiAny(them)}<div class="meaning" style="font-size:15px">${esc(themEn)}</div>${glossTable(splitTiles(them))}`};
  const sr=c.querySelector('#showr');if(sr)sr.onclick=reveal;

  const after=good=>{if(good)S.ok++;S.log.push(ask?[mine,them]:[them,mine]);mark(chatId(S.ti)+':'+S.i,good);if(good)sfxOk();else sfxBad();
    const fb=c.querySelector('#fb');fb.className='feedback '+(good?'ok':'bad');fb.innerHTML=good?'Nice.':'It will come back.';
    const row=c.querySelector('.row.actions');row.innerHTML='';const nb=document.createElement('button');nb.className='btn gold';nb.id='nextBtn';nb.innerHTML=(S.i+1<tp.x.length?'Next line':'Finish')+' <span class="keyhint">Enter</span>';nb.onclick=()=>{S.i++;render()};row.appendChild(nb);nb.focus()};
  if(store.chatInput==='tiles'){const tiles=splitTiles(mine);const ans=c.querySelector('#ans'),bank=c.querySelector('#bank'),chk=c.querySelector('#chk');const order=[];let done=false;
    const upd=()=>{chk.disabled=order.length!==tiles.length};

  const k=avail[Math.floor(Math.random()*avail.length)];const id='f:'+v[0]+':'+k;const right=f[k];
  const head=`<div class="formq"><div class="v ja">${v[0]}</div><div class="t">make it: ${FORMS[k][0]}</div>${hintbox(`<div class="hint">${toRomaji(v[0])} = ${v[2]} <span class="reg">${GROUPLABEL[v[1]]}</span></div><div class="meaning" style="font-size:17px">${esc(formMeaning(v[2],k))}</div><div class="hint">${esc(FORMS[k][1])}</div>`)}</div>${lessonBlock(k,false)}${itemStat(id)}`;
  const res=good=>(good?'Correct. ':`No. ${FORMS[k][0]} of ${v[0]} is `)+`<span class="ja">${right}</span> (${toRomaji(right)})${v[3]?`<div class="note">${esc(v[3])}</div>`:''}<div class="note"><b>Nearby forms:</b> ${['dict','masu','nai','ta','te','teru'].filter(x=>f[x]).map(x=>`<span class="ja">${f[x]}</span> <span class="hint">${FORMS[x][0]}</span>`).join(' · ')}</div>`;
  if(store.formMode==='type'){
    c.innerHTML=head+`<input type="text" id="inp" placeholder="type the romaji" autocomplete="off" autocapitalize="off"><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button><button class="btn" id="skip">Reveal</button></div>`;
    wireLesson(c,k,false);const inp=c.querySelector('#inp');inp.focus();let done=false;
    c.querySelector('#chk').onclick=()=>{if(done)return;const x=inp.value.trim();if(!x){inp.focus();return}done=true;finish(c,romMatch(x,toRomaji(right)),res(romMatch(x,toRomaji(right))),id,right)};
    c.querySelector('#skip').onclick=()=>{if(done)return;done=true;finish(c,false,res(false),id,right)};
  }else{
    const others=shuffle(Object.keys(f).filter(x=>f[x]!==right)).slice(0,3).map(x=>f[x]);const opts=shuffle([right,...others]);
    c.innerHTML=head+`<div class="choices">${opts.map(o=>`<button class="opt ja" data-r="${o}">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button></div>`;
    wireLesson(c,k,false);choiceFlow(c,opts,b=>b.dataset.r===right,good=>finish(c,good,res(good),id,right));
  }
  m.insertAdjacentHTML('beforeend',`<div class="card"><p class="hint">${VERBS.length} verbs, ${FORM_KEYS.length} forms each, all generated from the group rules, so once the rules click you can conjugate any verb you meet.</p></div>`);
}


/* ---------- TEST ---------- */
let TESTS=[];try{TESTS=JSON.parse(localStorage.getItem('kvt_tests')||'[]')}catch(e){}
function saveTests(){try{localStorage.setItem('kvt_tests',JSON.stringify(TESTS.slice(-100)))}catch(e){}}
const SECS={mixed:'Mixed (everything)',kana:'Kana reading',kanak:'Katakana only',words:'Words',wordsrev:'Words (English to kana)',sent:'Sentences (order)',sentmean:'Sentences (meaning)',talk:'Talk (pick the right answer)',forms:'Verb forms',adj:'Adjective forms'};
function mcItem(prompt,sub,opts,right,explain,say,id,ja){return {kind:'mc',prompt,sub,opts,right,explain,say,id,ja:!!ja}}
function genItem(sec){
  if(sec==='mixed'){const ks=Object.keys(SECS).filter(k=>k!=='mixed'&&k!=='kanak');sec=ks[Math.floor(Math.random()*ks.length)]}
  if(sec==='kana'||sec==='kanak'){const all=[];KANA.forEach(k=>{if(sec==='kana')all.push({id:'h:'+k.h,ch:k.h,r:k.r,row:k.row});all.push({id:'k:'+k.k,ch:k.k,r:k.r,row:k.row})});
    const it=all[Math.floor(Math.random()*all.length)];const near=shuffle(all.filter(x=>x.r!==it.r&&x.row===it.row)),oth=shuffle(all.filter(x=>x.r!==it.r));const dis=[];const seen=new Set([it.r]);for(const x of near.concat(oth)){if(!seen.has(x.r)){seen.add(x.r);dis.push(x.r)}if(dis.length===3)break}
    return mcItem(it.ch,'',shuffle([it.r,...dis]),it.r,`${it.ch} = ${it.r}`,it.ch,it.id,false)}
  if(sec==='words'){const it=VOCAB[Math.floor(Math.random()*VOCAB.length)];const dis=shuffle(VOCAB.filter(x=>x.en!==it.en)).slice(0,3).map(x=>x.en);
    return mcItem(it.jp,'',shuffle([it.en,...dis]),it.en,`${it.jp} = ${it.r} = ${it.en}`,it.jp,'v:'+it.jp,false)}
  if(sec==='wordsrev'){const it=VOCAB[Math.floor(Math.random()*VOCAB.length)];const dis=shuffle(VOCAB.filter(x=>x.jp!==it.jp)).slice(0,3).map(x=>x.jp);
    return mcItem(it.en,'',shuffle([it.jp,...dis]),it.jp,`${it.en} = ${it.jp} (${it.r})`,it.jp,'v:'+it.jp,true)}
  if(sec==='sent'){const b=BANK[Math.floor(Math.random()*BANK.length)];return {kind:'order',tiles:splitTiles(b.jp),en:b.en,r:b.r,note:b.note,say:b.jp,id:'b:'+b.jp}}
  if(sec==='sentmean'){const b=BANK[Math.floor(Math.random()*BANK.length)];const dis=shuffle(BANK.filter(x=>x.en!==b.en)).slice(0,3).map(x=>x.en);
    return mcItem(b.jp,'',shuffle([b.en,...dis]),b.en,`${b.jp} = ${b.r} = ${b.en}`,b.jp,'b:'+b.jp,false)}
  if(sec==='talk'){const q=CONV[Math.floor(Math.random()*CONV.length)];const a=q.a[Math.floor(Math.random()*q.a.length)];const pool=[];CONV.forEach(x=>{if(x!==q)x.a.forEach(y=>pool.push(y[0]))});const dis=shuffle(pool).slice(0,3);
    return mcItem(q.q,`${q.qe}. Which answer means: "${a[2]}"?`,shuffle([a[0],...dis]),a[0],`${a[0]} = ${a[1]}. ${a[3]}`,a[0],'q:'+q.q,true)}
  if(sec==='forms'){const v=VERBS[Math.floor(Math.random()*VERBS.length)];const f=conj(v);const ks=Object.keys(f);const k=ks[Math.floor(Math.random()*ks.length)];const dis=shuffle(ks.filter(x=>f[x]!==f[k])).slice(0,3).map(x=>f[x]);
    return mcItem(v[0],`${toRomaji(v[0])} = ${v[2]}. Make it: ${FORMS[k][0]}`,shuffle([f[k],...dis]),f[k],`${FORMS[k][0]} of ${v[0]} = ${f[k]} (${toRomaji(f[k])})`,f[k],'f:'+v[0]+':'+k,true)}
  if(sec==='adj'){const a=ADJ[Math.floor(Math.random()*ADJ.length)];const f=conjA(a);const ks=Object.keys(f);const k=ks[Math.floor(Math.random()*ks.length)];const dis=shuffle(ks.filter(x=>f[x]!==f[k])).slice(0,3).map(x=>f[x]);
    return mcItem(a[0],`${toRomaji(a[0])} = ${a[2]}. Make it: ${AFORMS[k][0]}`,shuffle([f[k],...dis]),f[k],`${AFORMS[k][0]} of ${a[0]} = ${f[k]} (${toRomaji(f[k])})`,f[k],'a:'+a[0]+':'+k,true)}
}
function test(m){
  const T=store.test;
  if(!T){
    const d=document.createElement('div');d.className='card';
    const best=sec=>{const r=TESTS.filter(t=>t.sec===sec);if(!r.length)return '';const b=Math.max(...r.map(t=>Math.round(100*t.ok/t.n)));return ` <span class="hint">best ${b}%</span>`};
    d.innerHTML=`<h2>Test yourself</h2><p>No hints, no reveal, no listen button until you have answered. A score at the end, and every miss listed so you can go drill it.</p>
     <div id="secs">${Object.keys(SECS).map(k=>`<span class="chip ${store.testSec===k?'on':''}" data-s="${k}">${SECS[k]}${best(k)}</span>`).join('')}</div>
     <p style="margin-top:10px"><span class="lab">Length</span> ${[10,20,30,50].map(n=>`<span class="chip ${store.testN===n?'on':''}" data-n="${n}">${n}</span>`).join('')}</p>
     <div class="row"><button class="btn gold" id="start">Start <span class="keyhint">Enter</span></button></div>`;
    d.querySelector('#secs').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;store.testSec=c.dataset.s;render()};
    d.onclick=e=>{const c=e.target.closest('[data-n]');if(c){store.testN=+c.dataset.n;render()}};
    const st=d.querySelector('#start');st.id='nextBtn';st.onclick=()=>{store.test={sec:store.testSec,n:store.testN,i:0,ok:0,miss:[],items:[]};const used=new Set();while(store.test.items.length<store.testN){const it=genItem(store.testSec);if(used.has(it.id)&&used.size<200)continue;used.add(it.id);store.test.items.push(it)}render()};
    m.appendChild(d);
    if(TESTS.length){const h=document.createElement('div');h.className='card';h.innerHTML=`<h2>History</h2><table class="hist">${TESTS.slice(-15).reverse().map(t=>`<tr><td>${t.date}</td><td>${SECS[t.sec]||t.sec}</td><td>${t.ok} / ${t.n}</td><td><b>${Math.round(100*t.ok/t.n)}%</b></td></tr>`).join('')}</table></div>`;m.appendChild(h)}
    return;
  }
  if(T.i>=T.n){
    const pct=Math.round(100*T.ok/T.n);
    if(!T.saved){T.saved=true;TESTS.push({date:new Date().toISOString().slice(0,10),sec:T.sec,n:T.n,ok:T.ok});saveTests();if(pct>=80)sfxStreak()}
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<h2>${SECS[T.sec]}: done</h2><div class="score">${T.ok} / ${T.n} (${pct}%)</div><p style="text-align:center">${pct>=90?'Native-ready on this one.':pct>=70?'Solid. Drill the misses and retest.':'Not there yet. The misses below tell you exactly what to drill.'}</p>
     ${T.miss.length?`<h2 style="margin-top:14px">Misses</h2>${T.miss.map(x=>`<div class="miss"><span class="ja">${x.prompt}</span> <span class="hint">${x.sub||''}</span><div>${x.explain}</div>${canSpeak?`<button class="btn small" data-say="${x.say}">Listen</button>`:''}</div>`).join('')}`:'<p>No misses.</p>'}
     <div class="row"><button class="btn gold" id="again">Same test again <span class="keyhint">Enter</span></button>${T.miss.length?'<button class="btn" id="retry">Retest only the misses</button>':''}<button class="btn" id="back">Back</button></div>`;
    d.querySelector('#again').id='nextBtn';d.querySelector('#nextBtn').onclick=()=>{store.test=null;render();document.querySelector('#nextBtn').click()};
    d.querySelector('#back').onclick=()=>{store.test=null;render()};
    const rt=d.querySelector('#retry');if(rt)rt.onclick=()=>{const items=T.miss.map(x=>x.item);store.test={sec:T.sec,n:items.length,i:0,ok:0,miss:[],items};render()};
    d.onclick=e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)};
    m.appendChild(d);return;
  }
  const it=T.items[T.i];
  const c=document.createElement('div');c.className='card';m.appendChild(c);
  const head=`<div class="hint">${SECS[T.sec]} · ${T.i+1} of ${T.n} · ${T.ok} right</div><div class="bar"><i style="width:${Math.round(100*T.i/T.n)}%"></i></div>`;
  const advance=()=>{T.i++;render()};
  const done=(good,explain)=>{mark(it.id,good);if(good){T.ok++;sfxOk()}else{T.miss.push({prompt:it.kind==='mc'?it.prompt:it.tiles.join(' '),sub:it.sub,explain,say:it.say,item:it});sfxBad()}
    const fb=c.querySelector('#fb');fb.className='feedback '+(good?'ok':'bad');fb.innerHTML=(good?'Correct. ':'No. ')+explain;
    const row=c.querySelector('.row.actions');row.innerHTML='';const nb=document.createElement('button');nb.className='btn gold';nb.id='nextBtn';nb.innerHTML='Next <span class="keyhint">Enter</span>';nb.onclick=advance;row.appendChild(nb);nb.focus()};
  if(it.kind==='mc'){
    c.innerHTML=head+`<div class="formq"><div class="v ${it.ja||/[぀-ヿ]/.test(it.prompt)?'ja':''}" style="font-size:${it.prompt.length>8?28:it.prompt.length>3?40:64}px">${it.prompt}</div>${it.sub?`<div class="hint" style="margin-top:6px">${esc(it.sub)}</div>`:''}</div>
     <div class="choices">${it.opts.map(o=>`<button class="opt ${it.ja?'ja':''}" data-r="${o}" style="font-size:${it.ja?20:16}px">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk">Check <span class="keyhint">Enter</span></button></div>`;
    choiceFlow(c,it.opts,b=>b.dataset.r===it.right,good=>done(good,it.explain));
  }else{
    c.innerHTML=head+`<div class="meaning">${esc(it.en)}</div><div class="tiles" id="ans"></div><div class="tiles" id="bank" style="border-style:solid">${shuffle(it.tiles.map((t,i)=>({t,i}))).map(o=>`<button class="tile ja ${PARTICLES.has(o.t)?'part':''}" data-i="${o.i}">${o.t}</button>`).join('')}</div>
     <div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="chk" disabled>Check <span class="keyhint">Enter</span></button><button class="btn" id="undo">Undo last <span class="keyhint">Backspace</span></button></div>`;
    const ans=c.querySelector('#ans'),bank=c.querySelector('#bank'),chk=c.querySelector('#chk');const order=[];let fin=false;
    const upd=()=>{chk.disabled=order.length!==it.tiles.length};
    bank.onclick=e=>{const b=e.target.closest('.tile');if(!b||fin)return;sfxTap();b.classList.add('used');order.push(+b.dataset.i);const n=b.cloneNode(true);n.classList.remove('used');ans.appendChild(n);upd()};
    ans.onclick=e=>{const b=e.target.closest('.tile');if(!b||fin)return;sfxTap();const i=+b.dataset.i;order.splice(order.indexOf(i),1);b.remove();bank.querySelector(`[data-i="${i}"]`).classList.remove('used');upd()};
    c.querySelector('#undo').onclick=()=>{if(fin||!order.length)return;const i=order.pop();ans.lastChild.remove();bank.querySelector(`[data-i="${i}"]`).classList.remove('used');upd()};
    chk.onclick=()=>{if(fin||order.length!==it.tiles.length)return;fin=true;const good=order.every((v,i)=>v===i);[...ans.children].forEach((t,i)=>{t.style.borderColor=order[i]===i?'var(--ok)':'var(--bad)'});done(good,`<span class="ja">${it.tiles.join(' ')}</span> = ${it.r}. ${esc(it.note)}`)};
  }
}

/* ---------- WRITING ---------- */
function write(m){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<h2>Write from memory</h2><div id="wm"><span class="chip ${store.wmode!=='word'?'on':''}" data-w="kana">Single kana</span><span class="chip ${store.wmode==='word'?'on':''}" data-w="word">Whole word</span></div>`;
  d.querySelector('#wm').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;store.wmode=c.dataset.w;render()};
  m.appendChild(d);
  let target,label,id;
  if(store.wmode==='word'){const pool=VOCAB.filter(v=>store.cats.has(v.cat));const it=pick(pool,v=>'w:'+v.jp,lastId);target=it.jp;label=`${it.r} (${esc(it.en)})`;id='w:'+it.jp}
  else{const pool=kanaPool();const it=pick(pool,x=>'w'+x.id,lastId);target=it.ch;label=`${it.r} in ${it.id[0]==='h'?'hiragana':'katakana'}`;id='w'+it.id}
  lastId=id;
  const c=document.createElement('div');c.className='card';
  const fs=target.length>3?70:target.length>1?110:200;
  c.innerHTML=`<div class="meaning">Write: ${label}</div>${itemStat(id)}<div class="canvasWrap"><canvas id="cv" width="280" height="280"></canvas><div class="ghost ja" id="ghost" style="font-size:${fs}px;display:none">${target}</div></div>
   <div class="feedback" id="fb"></div><div class="row actions"><button class="btn gold" id="reveal">Reveal</button><button class="btn" id="clear">Clear</button>${canSpeak?'<button class="btn" id="say">Listen</button>':''}</div><div class="row" id="grade" style="display:none"><span>Did you get it?</span><button class="btn" id="yes">Yes</button><button class="btn" id="no">No</button></div>`;
  m.appendChild(c);
  const cv=c.querySelector('#cv'),ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(226,194,122,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(140,0);ctx.lineTo(140,280);ctx.moveTo(0,140);ctx.lineTo(280,140);ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle='#ece7dc';
  let drawing=false;const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};
  cv.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  c.querySelector('#clear').onclick=()=>{ctx.clearRect(0,0,280,280)};
  const say=c.querySelector('#say');if(say)say.onclick=()=>speak(target);
  c.querySelector('#reveal').onclick=()=>{c.querySelector('#ghost').style.display='flex';c.querySelector('#grade').style.display='flex'};
  c.querySelector('#yes').onclick=()=>{c.querySelector('#grade').style.display='none';finish(c,true,'Nice',id,target)};
  c.querySelector('#no').onclick=()=>{c.querySelector('#grade').style.display='none';finish(c,false,'Keep the shape in mind, it will come back',id,target)};
  m.insertAdjacentHTML('beforeend','<div class="card"><p class="hint">Draw with finger or mouse, reveal, grade yourself honestly. This reinforces shape memory; it is not stroke-order practice.</p></div>');
}

/* ---------- REFERENCE ---------- */
function ref(m){
  const rows=k=>KANA.filter(x=>x.row===k);
  let h='<div class="card"><h2>Hiragana + katakana</h2><p>Hiragana (curvy) for Japanese words and particles, katakana (angular) for foreign words and names. Same sound, two shapes. Tap any cell to hear it.</p>';
  for(const k of Object.keys(ROWLABEL)){h+=`<p>${ROWLABEL[k]}</p><div class="grid">${rows(k).map(x=>`<div class="kcell" data-say="${x.h}"><div class="k ja">${x.h} ${x.k}</div><div class="r">${x.r}</div></div>`).join('')}</div>`}
  h+=`<p class="hint">In katakana the bar ー lengthens the vowel: ラーメン = raamen. In hiragana you add a vowel: おおきい = ookii. Small っ doubles the next consonant: きっぷ = kippu.</p></div>`;
  h+='<div class="card"><h2>All words</h2><p>Tap a row to hear it.</p>';
  for(const c of Object.keys(CATLABEL)){h+=`<p><b>${CATLABEL[c]}</b></p><table>${VOCAB.filter(v=>v.cat===c).map(v=>`<tr data-say="${v.jp}"><td class="j ja">${v.jp}</td><td class="r">${v.r}</td><td class="${v.warn?'warn':''}">${esc(v.en)}</td></tr>`).join('')}</table>`}
  h+='</div><div class="card"><h2>Sentences</h2><p>Tap a row to hear it.</p><table>'+BANK.map(b=>`<tr data-say="${b.jp.replace(/[ ？]/g,'')}"><td class="j ja">${b.jp}</td><td class="r">${b.r}</td><td>${esc(b.en)} <span class="reg">${b.reg}</span><div class="hint">${esc(b.note)}</div></td></tr>`).join('')+'</table><h2 style="margin-top:14px">Slot patterns</h2><table>'+SENT.map(s=>`<tr><td class="j ja">${s.t.join(' ')}</td><td class="r">${s.r}</td><td>${esc(s.en)}<div class="hint">${esc(s.note)}</div></td></tr>`).join('')+'</table></div>'+'<div class="card"><h2>Questions and your answers</h2>'+CONV.map(q=>`<p><b class="ja">${q.q}</b> <span class="hint">${q.qr} / ${esc(q.qe)}</span></p>`+q.a.map(a=>`<div class="ans" data-say="${a[0].replace(/[ ？＿]/g,'')}"><div class="a ja">${a[0]}</div><div class="ar">${a[1]}</div><div class="ae">${esc(a[2])}</div></div>`).join('')).join('')+'</div>';
  m.innerHTML=h;
  m.onclick=e=>{const t=e.target.closest('[data-say]');if(t&&canSpeak)speak(t.dataset.say)};
}

hud();render();
</script>
